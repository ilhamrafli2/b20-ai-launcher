name: Affiliate Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run affiliate agent
        run: node scripts/affiliate-agent.mjs
      - name: Commit generated queue
        run: |
          git config user.name 'affiliate-agent[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/affiliate-queue.json
          git diff --cached --quiet || git commit -m 'chore: generate affiliate queue'
          git push
